
name: Build Mouse Hole APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"


      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      - name: Configure persistent signing when secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.MOUSEHOLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.MOUSEHOLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOUSEHOLE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOUSEHOLE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            printf "%s" "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mousehole-signing.jks"
            echo "MOUSEHOLE_KEYSTORE_PATH=$RUNNER_TEMP/mousehole-signing.jks" >> "$GITHUB_ENV"
            echo "MOUSEHOLE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "MOUSEHOLE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MOUSEHOLE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Persistent APK signing enabled."
          else
            echo "::warning::Persistent signing secrets absent. See SIGNING_UPDATES.md. This debug APK may require uninstall."
          fi
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MouseHole-S23-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
